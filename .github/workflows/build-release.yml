name: Build and Pre-Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Go Native & Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Build Go Native Libraries (.so)
        run: |
          chmod +x core-proxy-go/build-android.sh
          cd core-proxy-go
          ./build-android.sh
          cd ..
          ls -R app/src/main/jniLibs

      - name: Grant execute permission for gradlew
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            gradle wrapper
            chmod +x gradlew
          fi

      - name: Build Android Release APK
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p release-artifacts
          find app/build/outputs/apk -name "*.apk" -exec cp {} release-artifacts/OmniProxy-release.apk \;
          ls -lh release-artifacts/

      - name: Create Pre-Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          tag_name: ${{ github.ref_name || 'v1.0.0-preview' }}
          name: "OmniProxy ${{ github.ref_name || 'v1.0.0-preview' }}"
          body: |
            ### OmniProxy (MD3E Expressive) Pre-Release
            
            ✨ **核心特性**：
            - **Material Design 3 Expressive (MD3E)**：全套弹簧弹性动效、大圆角与药丸几何形变、Monet 动态配色；
            - **Go 语言原生 JNI 核心 (`libomniproxy.so`)**：高吞吐并发 HTTP/HTTPS CONNECT 隧道与 SOCKS5 代理；
            - **VPN 热点共享与穿透**：单设备开启 VPN + 热点，从设备连入自动走本机 VPN 路由出口；
            - **热点设备管理**：基于网络邻居/ARP 实时查看连接到热点的从设备与 IP/MAC；
            - **PAC 动态配置与一键二维码配网**。
          files: release-artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
