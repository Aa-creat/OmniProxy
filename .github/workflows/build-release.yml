name: Build, Sign and Pre-Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Go Native & Sign Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & Build Tools
        run: |
          sdkmanager --install "ndk;26.1.10909125" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_BUILD_TOOLS=$ANDROID_HOME/build-tools/35.0.0" >> $GITHUB_ENV

      - name: Build Go Native JNI Libraries (.so)
        run: |
          chmod +x core-proxy-go/build-android.sh
          cd core-proxy-go
          ./build-android.sh
          cd ..
          ls -R app/src/main/jniLibs

      - name: Setup Gradle Wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Android Release APK (Unsigned)
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Secure APK Signing (Dual-Mode: Secrets / CI Keystore)
        id: sign_apk
        run: |
          mkdir -p release-artifacts
          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          ALIGNED_APK="release-artifacts/OmniProxy-aligned.apk"
          SIGNED_APK="release-artifacts/OmniProxy-v1.0.0-release.apk"

          echo "Found compiled APK: $RAW_APK"

          # 1. ZipAlign 4-byte boundary optimization
          $ANDROID_BUILD_TOOLS/zipalign -v -p 4 "$RAW_APK" "$ALIGNED_APK"

          # 2. Secure Signing Scheme (v2 + v3)
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "--> Using Production Keystore from GitHub Secrets"
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
            $ANDROID_BUILD_TOOLS/apksigner sign \
              --ks keystore.jks \
              --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
              --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
              --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out "$SIGNED_APK" \
              "$ALIGNED_APK"
            rm -f keystore.jks
          else
            echo "--> No Secret Keystore provided: Generating ephemeral CI Release Keystore"
            keytool -genkeypair -v \
              -keystore ci_release.jks \
              -alias omniproxy \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "omniproxypass" \
              -keypass "omniproxypass" \
              -dname "CN=OmniProxy, OU=Release, O=Aa-creat, C=US"

            $ANDROID_BUILD_TOOLS/apksigner sign \
              --ks ci_release.jks \
              --ks-key-alias omniproxy \
              --ks-pass pass:"omniproxypass" \
              --key-pass pass:"omniproxypass" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out "$SIGNED_APK" \
              "$ALIGNED_APK"
            rm -f ci_release.jks
          fi

          # 3. Verify Signature
          $ANDROID_BUILD_TOOLS/apksigner verify --verbose "$SIGNED_APK"

          # 4. Generate SHA-256 Checksum for Supply Chain Integrity
          cd release-artifacts
          sha256sum OmniProxy-v1.0.0-release.apk > checksums-sha256.txt
          cat checksums-sha256.txt
          cd ..

      - name: Create GitHub Pre-Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          tag_name: ${{ github.ref_name || 'v1.0.0-preview' }}
          name: "OmniProxy ${{ github.ref_name || 'v1.0.0-preview' }}"
          body: |
            ### 🚀 OmniProxy (MD3E Expressive) 预发布版本

            本版本由 GitHub Actions 安全构建并完成 APK v2/v3 签名校验。

            #### ✨ 核心特性：
            - **Material Design 3 Expressive (MD3E)**：全套弹簧物理动效、大圆角与药丸几何形变、Monet 动态取色；
            - **Go 原生网络核心驱动 (`libomniproxy.so`)**：高并发 HTTP/HTTPS CONNECT 隧道与 SOCKS5 代理；
            - **VPN 热点共享与穿透**：单设备开启 VPN + 热点，从设备连入自动走本机 VPN 路由出口；
            - **热点设备管理**：基于网络邻居/ARP 实时查看连接到热点的从设备与 IP/MAC；
            - **PAC 动态配置与一键二维码配网**。

            #### 🔒 供应链安全与校验和：
            发布产物已自动经过 `zipalign` 内存对齐与 `apksigner` (v1/v2/v3) 严格签名校验。
            请核对 SHA-256 校验和确保文件完整性。
          files: |
            release-artifacts/OmniProxy-v1.0.0-release.apk
            release-artifacts/checksums-sha256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
