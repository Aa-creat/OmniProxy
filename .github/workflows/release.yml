name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build, Sign and Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "build-tools;35.0.0" "platforms;android-36"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_BUILD_TOOLS=$ANDROID_HOME/build-tools/35.0.0" >> $GITHUB_ENV

      - name: Run Go Unit Tests
        run: |
          cd core-proxy-go
          go test -v ./pkg/...

      - name: Compile Go Native Libraries (.so)
        run: |
          chmod +x core-proxy-go/build-android.sh
          cd core-proxy-go
          ./build-android.sh
          cd ..
          ls -R app/src/main/jniLibs

      - name: Build Android Release APK
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --stacktrace

      - name: Sign APK (Production Keystore)
        run: |
          mkdir -p release-artifacts
          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          ALIGNED_APK="release-artifacts/OmniProxy-aligned.apk"
          SIGNED_APK="release-artifacts/OmniProxy-release.apk"

          echo "Found raw APK: $RAW_APK"

          if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ] || [ -z "${{ secrets.KEY_ALIAS }}" ] || [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ] || [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "::error::Missing required signing secrets (RELEASE_KEYSTORE_BASE64, KEY_ALIAS, KEYSTORE_PASSWORD, KEY_PASSWORD). Refusing to generate ephemeral keystore."
            exit 1
          fi

          $ANDROID_BUILD_TOOLS/zipalign -v -p 4 "$RAW_APK" "$ALIGNED_APK"

          echo "Signing with Secrets Keystore"
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          $ANDROID_BUILD_TOOLS/apksigner sign \
            --ks keystore.jks \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"
          rm -f keystore.jks

          $ANDROID_BUILD_TOOLS/apksigner verify --verbose "$SIGNED_APK"

          cd release-artifacts
          sha256sum OmniProxy-release.apk > checksums-sha256.txt
          cat checksums-sha256.txt
          cd ..

      - name: Publish Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          name: OmniProxy ${{ github.ref_name }}
          body: |
            ### 🚀 OmniProxy ${{ github.ref_name }}
            本版本已由 GitHub Actions 自动完成 Go/Android 单元测试、`zipalign` 对齐与 `apksigner` (v1/v2/v3) 生产密钥签名校验。
          files: |
            release-artifacts/OmniProxy-release.apk
            release-artifacts/checksums-sha256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
